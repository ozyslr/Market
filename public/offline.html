<!doctype html>
<html lang="tr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Bağlantı Kesildi — Benim Olan</title>
    <meta name="theme-color" content="#1A1033" />
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      body {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Inter', sans-serif;
        background: #F8F8FA;
        color: #1A1033;
        display: flex;
        align-items: center;
        justify-content: center;
        min-height: 100dvh;
        padding: 24px;
      }
      .container {
        text-align: center;
        max-width: 420px;
      }
      .icon {
        width: 96px;
        height: 96px;
        margin: 0 auto 24px;
        background: linear-gradient(135deg, #7c3aed, #1A1033);
        border-radius: 24px;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 48px;
        font-weight: 900;
        color: #fff;
      }
      h1 { font-size: 24px; margin-bottom: 12px; }
      p { font-size: 16px; color: #666; line-height: 1.6; margin-bottom: 32px; }
      .retry-btn {
        display: inline-block;
        background: #7c3aed;
        color: #fff;
        border: none;
        padding: 14px 32px;
        border-radius: 12px;
        font-size: 16px;
        font-weight: 600;
        cursor: pointer;
        transition: background 0.2s;
      }
      .retry-btn:hover { background: #6d28d9; }
      .retry-btn:active { background: #5b21b6; }
    </style>
  </head>
  <body>
    <div class="container">
      <div class="icon">M</div>
      <h1>Bağlantı Kesildi</h1>
      <p>İnternet bağlantınızı kontrol edin ve tekrar deneyin. Sayfa daha önce ziyaret ettiğiniz sayfaları önbellekten gösterebilir.</p>
      <button class="retry-btn" onclick="window.location.reload()">Tekrar Dene</button>
    </div>
    <script>
      // Auto-retry when back online
      window.addEventListener('online', function() {
        window.location.reload();
      });
    </script>
  </body>
</html>
