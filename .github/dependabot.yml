version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "Europe/Istanbul"
    open-pull-requests-limit: 10
    versioning-strategy: increase
    labels:
      - "dependencies"
      - "automerge"
    groups:
      react:
        patterns: ["react", "react-dom", "@types/react*"]
      firebase:
        patterns: ["firebase", "firebase-admin", "@firebase/*"]
      testing:
        patterns: ["vitest", "@vitest/*", "@testing-library/*", "@playwright/test", "jsdom", "jsdom"]
      stripe:
        patterns: ["stripe", "@stripe/*"]
      eslint:
        patterns: ["eslint", "@eslint/*", "@typescript-eslint/*", "eslint-plugin-*"]
      other:
        patterns: ["*"]
        update-types: ["minor", "patch"]
    ignore:
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]
      - dependency-name: "express"
        update-types: ["version-update:semver-major"]
      - dependency-name: "vite"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "Europe/Istanbul"
    labels:
      - "dependencies"
      - "github-actions"
